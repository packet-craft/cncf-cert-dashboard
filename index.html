<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNCF Exam Prep Dashboard — KCNA · KCSA · CKA</title>
  <meta name="description" content="Track study progress, exam readiness, commands and flashcards for the KCNA, KCSA and CKA certifications.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23326ce5'/%3E%3Cpath d='M16 6l8.7 5v10L16 26l-8.7-5V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-row">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>CNCF Exam Prep</h1>
          <p class="muted small">KCNA · KCSA · CKA</p>
        </div>
      </div>
      <button id="themeBtn" class="btn ghost" type="button" aria-label="Toggle colour theme">Theme</button>
    </div>
    <div class="wrap">
      <div id="certTabs" class="cert-tabs" role="group" aria-label="Certification"></div>
      <nav id="viewTabs" class="view-tabs" aria-label="Section"></nav>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="wrap footer muted small">
    <p>Progress is stored only in this browser (localStorage). Domain weights are study aids —
      always confirm against the official curriculum at
      <a href="https://github.com/cncf/curriculum" rel="noopener noreferrer">github.com/cncf/curriculum</a>.</p>
    <p>
      <button id="exportBtn" class="link" type="button">Export progress</button> ·
      <button id="importBtn" class="link" type="button">Import progress</button> ·
      <input id="importInput" type="file" accept="application/json" hidden>
      <button id="resetBtn" class="link danger" type="button">Reset all progress</button>
    </p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
